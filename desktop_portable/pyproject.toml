[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "yadavarifork"
version = "0.1.0"
description = "Portable Windows research and proposal assistant"
readme = "README.md"
requires-python = ">=3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "PySide6==6.12.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
test = []

[project.scripts]
yadavarifork = "yadavarifork.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
