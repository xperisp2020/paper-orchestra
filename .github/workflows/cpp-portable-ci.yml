name: C++ Windows portable CI
on:
  push:
    branches: [work/yadavarifork]
    paths:
      - 'app_cpp/**'
      - '.github/workflows/cpp-portable-ci.yml'
  pull_request:
    branches: [work/yadavarifork]
    paths:
      - 'app_cpp/**'
      - '.github/workflows/cpp-portable-ci.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
      - name: Configure
        run: cmake -S app_cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel --target yadavarifork yadavarifork_smoke
      - name: Smoke test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            $exe = Join-Path $PWD 'build/Release/yadavarifork_smoke.exe'
            $env:QT_QPA_PLATFORM = 'offscreen'
            & $exe --smoke-test
            Write-Host "Console smoke test exit code: $LASTEXITCODE"
            exit 1
          }
          @'
          import pathlib, zipfile, xml.etree.ElementTree as ET
          root = pathlib.Path("build/smoke-output")
          docx = root / "proposal.docx"
          pdf = root / "proposal.pdf"
          assert pdf.read_bytes().startswith(b"%PDF"), "invalid PDF signature"
          with zipfile.ZipFile(docx) as package:
              assert package.testzip() is None, "DOCX ZIP CRC failure"
              required = {"[Content_Types].xml", "_rels/.rels", "word/document.xml", "word/styles.xml", "word/_rels/document.xml.rels"}
              assert required.issubset(package.namelist()), "missing required Office Open XML part"
              xml_parts = [name for name in package.namelist() if name.endswith((".xml", ".rels"))]
              parsed = {name: ET.fromstring(package.read(name)) for name in xml_parts}
              doc = parsed["word/document.xml"]
              ns = "{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
              page_breaks = sum(1 for node in doc.iter(ns + "br") if node.attrib.get(ns + "type") == "page")
              assert page_breaks == 15, f"expected 15 page breaks for 16 form groups, got {page_breaks}"
          pngs = list((root / "proposal_png").glob("*.png"))
          assert pngs and all(p.read_bytes().startswith(b"\x89PNG\r\n\x1a\n") for p in pngs), "invalid PNG page output"
          print(f"PDF, DOCX package/XML, {len(pngs)} PNG pages, and 15 page breaks verified")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Export package validation failed." }
      - name: Assemble portable directory
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/Release/yadavarifork.exe'
          if (!(Test-Path $exe)) { throw "Application executable not found: $exe" }
          $deploy = Get-Command windeployqt -ErrorAction Stop
          & $deploy.Source --release --no-translations --sql $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          Remove-Item build/Release/yadavarifork_smoke.exe -ErrorAction SilentlyContinue
          Remove-Item build/Release/yadavarifork_smoke.pdb -ErrorAction SilentlyContinue
          Copy-Item app_cpp/README.md build/Release/README.txt
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Deployed executable smoke test failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path 'build/Release/*' -DestinationPath 'build/yadavarifork-windows-portable.zip' -Force
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: yadavarifork-windows-portable
          path: build/yadavarifork-windows-portable.zip
          if-no-files-found: error

  verify-portable-artifact:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: yadavarifork-windows-portable
          path: artifact
      - name: Extract and verify on a clean runner
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'artifact/yadavarifork-windows-portable.zip'
          if (!(Test-Path $archive)) { throw "Portable archive is missing." }
          Expand-Archive -LiteralPath $archive -DestinationPath 'portable'
          $root = Join-Path $PWD 'portable'
          $exe = Join-Path $root 'yadavarifork.exe'
          if (!(Test-Path $exe)) { throw "Portable executable is missing." }
          foreach ($required in @('README.txt', 'Qt6Core.dll', 'Qt6Widgets.dll', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll')) {
            if (!(Test-Path (Join-Path $root $required))) { throw "Required portable file is missing: $required" }
          }
          if (Test-Path (Join-Path $root 'yadavarifork_smoke.exe')) { throw "Test-only executable leaked into portable package." }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Clean-runner portable smoke test failed with exit code $($process.ExitCode)." }
          Write-Host "Clean-runner portable smoke test passed."
