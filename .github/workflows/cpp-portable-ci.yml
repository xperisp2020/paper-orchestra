name: C++ Windows portable CI
on:
  push:
    branches: [work/yadavarifork]
    paths:
      - 'app_cpp/**'
      - '.github/workflows/cpp-portable-ci.yml'
  pull_request:
    branches: [work/yadavarifork]
    paths:
      - 'app_cpp/**'
      - '.github/workflows/cpp-portable-ci.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
      - name: Configure
        run: cmake -S app_cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Smoke test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            $exe = Join-Path $PWD 'build/Release/yadavarifork.exe'
            $env:QT_QPA_PLATFORM = 'offscreen'
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -NoNewWindow -Wait -PassThru
            Write-Host "Direct smoke test exit code: $($process.ExitCode)"
            exit 1
          }
      - name: Assemble portable directory
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build/Release/yadavarifork.exe'
          if (!(Test-Path $exe)) { throw "Application executable not found: $exe" }
          $deploy = Get-Command windeployqt -ErrorAction Stop
          & $deploy.Source --release --no-translations --sql $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          Copy-Item app_cpp/README.md build/Release/README.txt
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Deployed executable smoke test failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path 'build/Release/*' -DestinationPath 'build/yadavarifork-windows-portable.zip' -Force
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: yadavarifork-windows-portable
          path: build/yadavarifork-windows-portable.zip
          if-no-files-found: error
