name: Python safety tests

on:
  push:
    branches: [work/yadavarifork]
    paths:
      - "paper_writing_cli.py"
      - "utils/**"
      - "methods/**"
      - "autoraters/**"
      - "tests/**"
      - ".github/workflows/python-safety-tests.yml"
  pull_request:
    paths:
      - "paper_writing_cli.py"
      - "utils/**"
      - "methods/**"
      - "autoraters/**"
      - "tests/**"
      - ".github/workflows/python-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library safety tests
        run: python -m unittest discover -s tests -v
