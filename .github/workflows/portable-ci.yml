name: Portable Windows CI

on:
  push:
    branches: ["work/yadavarifork"]
    paths:
      - "desktop_portable/**"
      - ".github/workflows/portable-ci.yml"
  pull_request:
    branches: ["work/yadavarifork"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: desktop_portable/pyproject.toml
      - name: Install application and build tools
        working-directory: desktop_portable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Run domain and GUI smoke tests
        working-directory: desktop_portable
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
